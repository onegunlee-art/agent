[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-company-os"
version = "0.1.0"
description = "Local, auditable AI company operating kernel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
company = "company_os.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
